<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قائمة مهامي</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17302a;--mute:#6b7f78;--line:#dbe5e0;--acc:#0f7b6c;--acc2:#d9efe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172622;--ink:#e6f1ed;--mute:#8aa59c;--line:#274039;--acc:#3fc2ac;--acc2:#1d3a33}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172622;--ink:#e6f1ed;--mute:#8aa59c;--line:#274039;--acc:#3fc2ac;--acc2:#1d3a33}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Tahoma",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 16px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:9px 0;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff}
.prog{margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--acc2) 0);display:grid;place-items:center;flex:none;transition:background .3s}
.ring span{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.prog p{margin:0;color:var(--mute)}
.prog b{color:var(--ink);font-size:1.05rem}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.add button,.clear{font:inherit;font-weight:600;border:0;border-radius:12px;background:var(--acc);color:#fff;padding:0 18px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
li input{width:22px;height:22px;accent-color:var(--acc);flex:none;cursor:pointer}
li label{flex:1;cursor:pointer;word-break:break-word}
li.done label{text-decoration:line-through;color:var(--mute)}
li .del{border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer;padding:0 4px}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.foot{margin-top:16px;text-align:center}
.clear{background:none;color:var(--mute);border:1px solid var(--line);padding:8px 16px}
</style>
</head>
<body>
<main>
<h1>قائمة مهامي</h1>
<div class="tabs" role="tablist">
<button role="tab" data-k="day" aria-selected="true">اليوم</button>
<button role="tab" data-k="week" aria-selected="false">الأسبوع</button>
<button role="tab" data-k="month" aria-selected="false">الشهر</button>
</div>
<div class="prog">
<div class="ring" id="ring"><span id="pct">0%</span></div>
<div><b id="title"></b><p id="count"></p></div>
</div>
<div class="add">
<input id="inp" placeholder="اكتب مهمة جديدة..." maxlength="120">
<button id="addBtn">أضف</button>
</div>
<ul id="list"></ul>
<div class="foot"><button class="clear" id="clr">احذف المهام المكتملة</button></div>
</main>
<script>
var KEY="checklist-v1",cur="day",titles={day:"تقدم اليوم",week:"تقدم الأسبوع",month:"تقدم الشهر"};
var data={day:[],week:[],month:[]};
try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.day&&d.week&&d.month)data=d}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function render(){
var items=data[cur],done=items.filter(function(t){return t.done}).length;
var p=items.length?Math.round(done/items.length*100):0;
$("ring").style.setProperty("--p",p);$("pct").textContent=p+"%";
$("title").textContent=titles[cur];
$("count").textContent=items.length?("أنجزت "+done+" من "+items.length+" مهمة"):"ما بعد ضفت مهام";
var ul=$("list");ul.innerHTML="";
if(!items.length){ul.innerHTML='<div class="empty">القائمة فارغة. اكتب أول مهمة فوق.</div>'}
items.forEach(function(t,i){
var li=document.createElement("li");if(t.done)li.className="done";
var cb=document.createElement("input");cb.type="checkbox";cb.checked=t.done;cb.id="t"+i;
cb.onchange=function(){t.done=cb.checked;save();render()};
var lb=document.createElement("label");lb.htmlFor=cb.id;lb.textContent=t.text;
var x=document.createElement("button");x.className="del";x.textContent="×";x.setAttribute("aria-label","حذف المهمة");
x.onclick=function(){items.splice(i,1);save();render()};
li.appendChild(cb);li.appendChild(lb);li.appendChild(x);ul.appendChild(li)});
}
function add(){var v=$("inp").value.trim();if(!v)return;data[cur].push({text:v,done:false});$("inp").value="";save();render();$("inp").focus()}
$("addBtn").onclick=add;
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("clr").onclick=function(){data[cur]=data[cur].filter(function(t){return !t.done});save();render()};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
cur=b.dataset.k;document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",o===b)});render()}});
render();
</script>
</body>
</html>
